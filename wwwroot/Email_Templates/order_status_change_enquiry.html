<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Order Status Updated</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            border-radius: 8px;
            padding: 30px;
            border: 1px solid #ddd;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .status-box {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .row {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="title">
            Order Status Updated
        </div>

        <p>Hello {{customername}},</p>

        <p>Your order status has been updated.</p>

        <div class="status-box">

            <div class="row">
                <span class="label">Order Number:</span>
                {{orderno}}
            </div>

            <div class="row">
                <span class="label">Product:</span>
                {{productname}}
            </div>

            <div class="row">
                <span class="label">New Status:</span>
                {{status}}
            </div>

        </div>

        <p>
            You can log in to your account to view more details.
        </p>

        <div class="footer">
            Thank you for shopping with us.
        </div>

    </div>
</body>
</html>
